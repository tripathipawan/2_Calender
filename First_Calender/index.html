<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animated Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 animate-fadeIn">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <button id="prev" class="text-xl font-bold px-3 py-1 rounded-full hover:bg-indigo-100 transition">❮</button>

      <h2 id="monthYear" class="text-xl font-semibold text-gray-800"></h2>

      <button id="next" class="text-xl font-bold px-3 py-1 rounded-full hover:bg-indigo-100 transition">❯</button>
    </div>

    <!-- Days -->
    <div class="grid grid-cols-7 text-center text-gray-500 text-sm font-semibold mb-2">
      <div>Sun</div><div>Mon</div><div>Tue</div>
      <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <!-- Dates -->
    <div id="calendarDays" class="grid grid-cols-7 gap-2 text-center"></div>

  </div>
  <script src="script.js"></script>
</body>
</html>
